site_name: postsynth
site_description: Generate synthetic post-training datasets in TRL-native formats.
site_url: https://wbrannock.github.io/postsynth/
repo_url: https://github.com/wbrannock/postsynth
repo_name: postsynth

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - tables

nav:
  - Home: index.md
  - CLI: cli.md
  - Python API: python-api.md
  - Models: models.md
  - Generation pipeline: generation-pipeline.md
