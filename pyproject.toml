[project]
name = "postsynth"
version = "0.1.0"
description = "Generate synthetic post-training datasets in TRL-native formats."
readme = "README.md"
authors = [
    { name = "William Brannock", email = "wbrannock@vt.edu" }
]
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "tenacity>=8.2.0",
    "tqdm>=4.66.0",
    "typer>=0.12.0",
]

[project.scripts]
postsynth = "postsynth.cli:app"

[dependency-groups]
dev = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.7.6",
    "pytest>=8.0.0",
]

[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"
